
name: Daily YouTube Video Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts requests

      - name: Generate Hindi Scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          from pathlib import Path

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY secret missing hai.")

          base = "https://generativelanguage.googleapis.com/v1beta"
          headers = {"Content-Type": "application/json",
                     "x-goog-api-key": key}

          def request(url, data=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode("utf-8") if data is not None else None,
                  headers=headers,
                  method="POST" if data is not None else "GET"
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  print("Google API error:", e.code)
                  print(e.read().decode("utf-8", errors="replace")[:2000])
                  raise

          models = request(base + "/models").get("models", [])
          candidates = [
              m["name"] for m in models
              if "generateContent" in m.get("supportedGenerationMethods", [])
          ]
          preferred = [
              "models/gemini-2.5-flash",
              "models/gemini-2.0-flash"
          ]
          model = next((m for m in preferred if m in candidates), None)
          if not model:
              model = next(
                  (m for m in candidates if "flash" in m.lower()),
                  candidates[0] if candidates else None
              )
          if not model:
              raise SystemExit("API key ke liye compatible model nahi mila.")

          print("Selected model:", model)

          prompt = """
          Hindi YouTube channel ke liye ek interesting science, technology ya
          real-world mystery topic chuno. Facts invent mat karo.
          Sirf valid JSON, Hindi Devanagari mein return karo:
          {
            "topic": "topic",
            "title": "Shorts title",
            "short_script": "45-60 second narration",
            "long_title": "long video title",
            "long_script": "4-5 minute narration",
            "description": "Hindi description",
            "hashtags": ["#Science", "#Hindi", "#Mystery"],
            "thumbnail_text": "short thumbnail text"
          }
          """

          result = request(
              base + "/" + model + ":generateContent",
              {
                "contents": [{"parts": [{"text": prompt}]}],
                "generationConfig": {
                  "temperature": 0.7,
                  "responseMimeType": "application/json"
                }
              }
          )

          parts = result.get("candidates", [{}])[0].get(
              "content", {}).get("parts", [])
          raw = "".join(p.get("text", "") for p in parts).strip()
          if not raw:
              raise SystemExit("Gemini ne content return nahi kiya.")

          try:
              content = json.loads(raw)
          except json.JSONDecodeError:
              start, end = raw.find("{"), raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit("Gemini response valid JSON nahi hai.")
              content = json.loads(raw[start:end + 1])

          out = Path("output")
          out.mkdir(exist_ok=True)
          (out / "content.json").write_text(
              json.dumps(content, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          for field, filename in [
              ("short_script", "short_script.txt"),
              ("long_script", "long_script.txt")
          ]:
              text = content.get(field, "").strip()
              if not text:
                  raise SystemExit("Script missing: " + field)
              (out / filename).write_text(text, encoding="utf-8")

          (out / "content.md").write_text(
              "# " + content.get("title", "") +
              "\n\n## Shorts\n" + content["short_script"] +
              "\n\n## Long video\n" + content["long_script"] +
              "\n\n## Description\n" + content.get("description", "") +
              "\n\n## Hashtags\n" + " ".join(content.get("hashtags", [])),
              encoding="utf-8"
          )
          print("Scripts generated.")
          PY

      - name: Generate Female Hindi Voice
        run: |
          edge-tts --voice hi-IN-SwaraNeural \
            --file output/short_script.txt \
            --write-media output/short_voice.mp3 \
            --write-subtitles output/short.srt

          edge-tts --voice hi-IN-SwaraNeural \
            --file output/long_script.txt \
            --write-media output/long_voice.mp3 \
            --write-subtitles output/long.srt

      - name: Download Images
        run: |
          python - <<'PY'
          import requests, time
          from pathlib import Path

          folder = Path("output/images")
          folder.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers["User-Agent"] = "EducationalVideoBot/1.0 (GitHub Actions)"

          topics = [
              "space nebula", "Mars planet", "black hole astronomy",
              "deep sea ocean", "robot technology", "galaxy stars",
              "scientific laboratory", "telescope astronomy"
          ]
          saved = 0

          for topic in topics:
              if saved >= 8:
                  break
              try:
                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": topic + " filetype:bitmap",
                          "gsrnamespace": 6,
                          "gsrlimit": 8,
                          "prop": "imageinfo",
                          "iiprop": "url",
                          "iiurlwidth": 1280,
                          "format": "json"
                      },
                      timeout=25
                  )
                  response.raise_for_status()
                  pages = response.json().get("query", {}).get("pages", {})

                  for page in pages.values():
                      if saved >= 8:
                          break
                      info = page.get("imageinfo", [{}])[0]
                      url = info.get("thumburl") or info.get("url")
                      if not url:
                          continue
                      try:
                          img = session.get(url, timeout=25)
                          img.raise_for_status()
                          if not img.headers.get("Content-Type", "").startswith("image/"):
                              continue
                          if len(img.content) < 10000:
                              continue
                          saved += 1
                          (folder / f"image_{saved:02}.img").write_bytes(img.content)
                          print("Downloaded:", topic, saved)
                      except Exception as e:
                          print("Image skipped:", str(e)[:150])
                  time.sleep(0.3)
              except Exception as e:
                  print("Search skipped:", topic, str(e)[:150])

          if saved == 0:
              raise SystemExit("Images download nahi hui; internet/source check karein.")
          print("Images downloaded:", saved)
          PY

      - name: Render Shorts and Long Video
        run: |
          python - <<'PY'
          import subprocess, json
          from pathlib import Path

          out = Path("output")
          image_files = sorted((out / "images").glob("*.img"))
          if not image_files:
              raise SystemExit("Images missing.")

          def run(args):
              subprocess.run(args, check=True)

          def get_duration(path):
              value = subprocess.check_output([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ], text=True).strip()
              return float(value)

          def create_video(label, voice_name, srt_name, width, height, filename):
              voice = out / voice_name
              srt = out / srt_name
              if not voice.exists() or not srt.exists():
                  raise SystemExit("Voice/subtitle file missing: " + label)

              duration = get_duration(voice)
              segments = []
              selected = image_files[:8]

              for i, img in enumerate(selected):
                  segment = out / f"{label}_{i:02}.mp4"
                  vf = (
                      f"scale={width}:{height}:force_original_aspect_ratio=increase,"
                      f"crop={width}:{height},"
                      f"zoompan=z='min(zoom+0.0008,1.12)':d=1:"
                      f"x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
                      f"s={width}x{height}:fps=25,format=yuv420p"
                  )
                  run([
                      "ffmpeg", "-y", "-loglevel", "error",
                      "-loop", "1", "-i", str(img),
                      "-vf", vf, "-t", "5",
                      "-an", "-c:v", "libx264", "-preset", "ultrafast",
                      "-pix_fmt", "yuv420p", str(segment)
                  ])
                  segments.append(segment)

              concat = out / f"{label}_concat.txt"
              concat.write_text(
                  "".join(f"file '{p.resolve()}'\n" for p in segments),
                  encoding="utf-8"
              )
              slideshow = out / f"{label}_slideshow.mp4"
              run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-f", "concat", "-safe", "0", "-i", str(concat),
                  "-c", "copy", str(slideshow)
              ])

              final = out / filename
              subtitle_filter = (
                  f"subtitles={srt.as_posix()}:"
                  "force_style='FontName=DejaVu Sans,FontSize=24,"
                  "PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,"
                  "BorderStyle=1,Outline=2,Alignment=2,MarginV=50'"
              )

              run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-stream_loop", "-1", "-i", str(slideshow),
                  "-i", str(voice),
                  "-vf", subtitle_filter,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-t", str(duration),
                  "-c:v", "libx264", "-preset", "ultrafast",
                  "-crf", "25", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "128k",
                  "-movflags", "+faststart", str(final)
              ])
              print("Video created:", final)

          create_video(
              "short", "short_voice.mp3", "short.srt",
              720, 1280, "youtube_short.mp4"
          )
          create_video(
              "long", "long_voice.mp3", "long.srt",
              1280, 720, "youtube_long.mp4"
          )
          print("Both videos completed.")
          PY

      - name: Upload Video Package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-package-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
