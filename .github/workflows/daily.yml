name: Daily YouTube Cartoon Story Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-indic fonts-noto
          python -m pip install --upgrade pip
          pip install edge-tts requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Generate Hindi Cartoon Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from pathlib import Path

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY secret missing.")

          base = "https://generativelanguage.googleapis.com/v1beta"
          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": key
          }

          def request_api(url, data=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode("utf-8") if data else None,
                  headers=headers,
                  method="POST" if data else "GET"
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          model_data = request_api(base + "/models")
          available = [m["name"] for m in model_data.get("models", []) if "generateContent" in m.get("supportedGenerationMethods", [])]
          
          candidates = [m for m in available if "flash" in m.lower()]

          prompt = """
          Create an engaging Hindi cartoon moral story for kids. 
          The story should be funny, educational, and have a good moral at the end.
          Write natural Hindi in Devanagari.
          Return only valid JSON with these fields:
          {
            "topic": "Short English keyword for image generation",
            "title": "Shorts title in Hindi",
            "short_script": "Narration of about 45-60 seconds",
            "long_title": "Long video title in Hindi",
            "long_script": "Narration of about 3-4 minutes",
            "description": "Hindi video description",
            "hashtags": ["#Cartoon", "#HindiStories", "#Kids"]
          }
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.8, "responseMimeType": "application/json"}
          }

          result = None
          for model in candidates:
              try:
                  result = request_api(base + "/" + model + ":generateContent", payload)
                  break
              except Exception:
                  continue

          if not result:
              raise SystemExit("Gemini API failed to generate script.")

          parts = result.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          raw = "".join(p.get("text", "") for p in parts).strip()

          try:
              content = json.loads(raw)
          except json.JSONDecodeError:
              start = raw.find("{")
              end = raw.rfind("}")
              content = json.loads(raw[start:end + 1])

          out = Path("output")
          out.mkdir(exist_ok=True)

          (out / "content.json").write_text(json.dumps(content, ensure_ascii=False, indent=2), encoding="utf-8")
          (out / "short_script.txt").write_text(content["short_script"], encoding="utf-8")
          (out / "long_script.txt").write_text(content["long_script"], encoding="utf-8")
          PY

      - name: Generate Hindi Voice and Subtitles
        run: |
          edge-tts --voice hi-IN-SwaraNeural --file output/short_script.txt --write-media output/short_voice.mp3 --write-subtitles output/short.srt
          edge-tts --voice hi-IN-SwaraNeural --file output/long_script.txt --write-media output/long_voice.mp3 --write-subtitles output/long.srt

      - name: Download Cartoon Images from Wikimedia
        run: |
          python - <<'PY'
          import requests
          import time
          from pathlib import Path

          folder = Path("output/images")
          folder.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers["User-Agent"] = "HindiCartoonVideo/1.0"

          # Cartoon aur kids story se judi images search karega
          topics = [
              "cartoon illustration", "fairy tale illustration", 
              "kids story cartoon", "animated landscape", 
              "comic cartoon art", "cartoon animals", 
              "cartoon village", "children book illustration"
          ]

          saved = 0

          for topic in topics:
              if saved >= 8:
                  break

              try:
                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": topic + " filetype:bitmap",
                          "gsrnamespace": 6,
                          "gsrlimit": 5,
                          "prop": "imageinfo",
                          "iiprop": "url",
                          "iiurlwidth": 1280,
                          "format": "json"
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  pages = response.json().get("query", {}).get("pages", {})

                  for page in pages.values():
                      if saved >= 8:
                          break

                      info = page.get("imageinfo", [{}])[0]
                      url = info.get("thumburl") or info.get("url")
                      if not url:
                          continue

                      try:
                          image = session.get(url, timeout=30)
                          image.raise_for_status()

                          if not image.headers.get("Content-Type", "").startswith("image/"):
                              continue

                          if len(image.content) < 10000:
                              continue

                          saved += 1
                          path = folder / f"image_{saved:02}.jpg"
                          path.write_bytes(image.content)
                          print("Downloaded image:", saved)

                      except Exception as e:
                          print("Image skipped:", str(e)[:120])
                  time.sleep(0.5)
              except Exception as e:
                  print("Search skipped:", str(e)[:120])

          if saved == 0:
              raise SystemExit("No images downloaded.")
          PY

      - name: Render Smooth Videos with Subtitles
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          out = Path("output")
          images = sorted((out / "images").glob("*.jpg"))

          def run(args):
              subprocess.run(args, check=True)

          def duration(path):
              value = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", str(path)
              ], text=True).strip()
              return float(value)

          def render(label, voice_name, srt_name, width, height, filename):
              voice = out / voice_name
              srt = out / srt_name
              clips = []

              # Smooth Zoom effect (Ken Burns)
              for i, image in enumerate(images):
                  clip = out / f"{label}_{i:02}.mp4"
                  vf = (
                      f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      "zoompan=z='min(zoom+0.0015,1.4)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
                      f"d=125:s={width}x{height}:fps=25,format=yuv420p"
                  )
                  run(["ffmpeg", "-y", "-loglevel", "error", "-loop", "1", "-i", str(image),
                       "-vf", vf, "-t", "5", "-an", "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p", str(clip)])
                  clips.append(clip)

              concat = out / f"{label}_concat.txt"
              concat.write_text("".join(f"file '{p.resolve()}'\n" for p in clips), encoding="utf-8")

              slideshow = out / f"{label}_slideshow.mp4"
              run(["ffmpeg", "-y", "-loglevel", "error", "-f", "concat", "-safe", "0", "-i", str(concat), "-c", "copy", str(slideshow)])

              # Hindi Subtitle Fix
              subtitle_filter = (
                  f"subtitles={srt.as_posix()}:"
                  "force_style='FontName=Noto Sans Devanagari,FontSize=26,"
                  "PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,"
                  "BorderStyle=1,Outline=2,Alignment=2,MarginV=50'"
              )

              final = out / filename
              run(["ffmpeg", "-y", "-loglevel", "error", "-stream_loop", "-1", "-i", str(slideshow),
                   "-i", str(voice), "-vf", subtitle_filter, "-map", "0:v:0", "-map", "1:a:0",
                   "-t", str(duration(voice)), "-c:v", "libx264", "-preset", "ultrafast", "-crf", "25",
                   "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart", str(final)])

          render("short", "short_voice.mp3", "short.srt", 720, 1280, "youtube_short.mp4")
          render("long", "long_voice.mp3", "long.srt", 1280, 720, "youtube_long.mp4")
          PY

      - name: Upload Videos to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"].strip(),
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          credentials.refresh(Request())
          youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)

          content = json.loads(Path("output/content.json").read_text(encoding="utf-8"))
          description = (content.get("description", "") + "\n\n" + " ".join(content.get("hashtags", []))).strip()

          videos = [
              ("output/youtube_short.mp4", (content["title"] + " #Shorts")[:100], description + "\n#Shorts"),
              ("output/youtube_long.mp4", content["long_title"][:100], description)
          ]

          for filename, title, desc in videos:
              path = Path(filename)
              body = {
                  "snippet": {
                      "title": title,
                      "description": desc[:5000],
                      "categoryId": "24",
                      "defaultLanguage": "hi"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": True
                  }
              }

              media = MediaFileUpload(str(path), mimetype="video/mp4", resumable=True)
              response = youtube.videos().insert(part="snippet,status", body=body, media_body=media).execute()
              print("Upload successful. Video ID:", response["id"])
          PY
