name: Daily YouTube Video Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean old files
        run: rm -rf output

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib Pillow

      - name: Install Hindi Fonts
        run: |
          sudo apt-get install -y fonts-indic fonts-noto

      - name: Generate Hindi Scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import random
          from pathlib import Path

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY secret missing.")

          base = "https://generativelanguage.googleapis.com/v1beta"
          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": key
          }

          def request_api(url, data=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode("utf-8") if data else None,
                  headers=headers,
                  method="POST" if data else "GET"
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              model_data = request_api(base + "/models")
          except Exception as e:
              raise SystemExit(
                  "Could not list Gemini models. Check API key and API access. "
                  + str(e)
              )

          available = [
              m["name"] for m in model_data.get("models", [])
              if "generateContent" in m.get(
                  "supportedGenerationMethods", []
              )
          ]

          preferred = [
              "models/gemini-3.8-flash",
              "models/gemini-3.5-flash-lite",
              "models/gemini-3.6-flash"
          ]

          candidates = [m for m in preferred if m in available]
          candidates += [
              m for m in available
              if "flash" in m.lower() and m not in candidates
              and "2.5" not in m.lower()
          ]

          if not candidates:
              print("Available models:", available)
              raise SystemExit(
                  "No supported Gemini Flash model available to this API key."
              )

          topics = ["Space", "Artificial Intelligence", "Black Holes", "Deep Sea Mysteries", "Quantum Physics", "Ancient Technology", "Future Tech", "Aliens", "Time Travel"]
          random_topic = random.choice(topics)

          prompt = f"""
          Create an engaging Hindi YouTube video about {random_topic} or a related scientific mystery.
          Use accurate facts and do not invent scientific claims.
          Write natural Hindi in Devanagari.
          Return only valid JSON with these fields:
          {{
            "topic": "topic",
            "title": "Shorts title in Hindi",
            "short_script": "Narration of about 45-60 seconds",
            "long_title": "Long video title in Hindi",
            "long_script": "Narration of about 4-5 minutes",
            "description": "Hindi video description",
            "hashtags": ["#Science", "#Hindi", "#Mystery"]
          }}
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.7,
                  "responseMimeType": "application/json"
              }
          }

          result = None
          selected_model = None

          for model in candidates:
              print("Trying Gemini model:", model)
              try:
                  result = request_api(
                      base + "/" + model + ":generateContent",
                      payload
                  )
                  selected_model = model
                  break
              except urllib.error.HTTPError as e:
                  details = e.read().decode("utf-8", errors="replace")
                  print("Model request failed:", e.code, model)
                  print(details[:500])
              except Exception as e:
                  print("Model failed:", model, str(e)[:300])

          if result is None:
              raise SystemExit(
                  "All available Gemini Flash models failed. "
                  "Check Google AI Studio API access and billing/quota."
              )

          parts = result.get("candidates", [{}])[0].get(
              "content", {}
          ).get("parts", [])
          raw = "".join(p.get("text", "") for p in parts).strip()

          if not raw:
              raise SystemExit(
                  "Gemini returned no script. Check API response and quota."
              )

          try:
              content = json.loads(raw)
          except json.JSONDecodeError:
              start = raw.find("{")
              end = raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit("Gemini returned invalid JSON.")
              content = json.loads(raw[start:end + 1])

          required = [
              "topic", "title", "short_script",
              "long_title", "long_script", "description"
          ]
          for field in required:
              if not str(content.get(field, "")).strip():
                  raise SystemExit("Missing content field: " + field)

          if not isinstance(content.get("hashtags", []), list):
              content["hashtags"] = ["#Science", "#Hindi", "#Mystery"]

          out = Path("output")
          out.mkdir(exist_ok=True)

          (out / "content.json").write_text(
              json.dumps(content, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          (out / "short_script.txt").write_text(
              content["short_script"], encoding="utf-8"
          )
          (out / "long_script.txt").write_text(
              content["long_script"], encoding="utf-8"
          )

          print("Scripts generated using:", selected_model, "| Topic:", random_topic)
          PY

      - name: Generate Hindi Voice and Subtitles
        run: |
          edge-tts \
            --voice hi-IN-SwaraNeural \
            --file output/short_script.txt \
            --write-media output/short_voice.mp3 \
            --write-subtitles output/short.srt

          edge-tts \
            --voice hi-IN-SwaraNeural \
            --file output/long_script.txt \
            --write-media output/long_voice.mp3 \
            --write-subtitles output/long.srt

      - name: Download Science Images
        run: |
          python - <<'PY'
          import requests
          import time
          import random
          from pathlib import Path
          from PIL import Image
          import io

          folder = Path("output/images")
          folder.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers["User-Agent"] = "HindiScienceVideo/1.0"

          topics = [
              "space nebula", "Mars planet", "black hole astronomy",
              "deep sea ocean", "robot technology", "galaxy stars",
              "scientific laboratory", "telescope astronomy"
          ]
          
          random.shuffle(topics)
          saved = 0

          for topic in topics:
              if saved >= 8:
                  break

              try:
                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": topic + " filetype:bitmap",
                          "gsrnamespace": 6,
                          "gsrlimit": 8,
                          "prop": "imageinfo",
                          "iiprop": "url",
                          "iiurlwidth": 1280,
                          "format": "json"
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  pages = response.json().get("query", {}).get("pages", {})

                  for page in pages.values():
                      if saved >= 8:
                          break

                      info = page.get("imageinfo", [{}])[0]
                      url = info.get("thumburl") or info.get("url")
                      if not url:
                          continue

                      try:
                          image_data = session.get(url, timeout=30).content
                          
                          if len(image_data) < 10000:
                              continue

                          img = Image.open(io.BytesIO(image_data))
                          img.verify()

                          if img.format not in ["JPEG", "PNG"]:
                              continue

                          saved += 1
                          path = folder / f"image_{saved:02}.jpg"
                          path.write_bytes(image_data)
                          print("Downloaded valid image:", saved)

                      except Exception as e:
                          print(f"Corrupt image skipped: {str(e)[:80]}")
                          continue

                  time.sleep(0.5)

              except Exception as e:
                  print("Search skipped:", str(e)[:120])

          if saved == 0:
              raise SystemExit("No valid images downloaded.")

          print("Total valid images:", saved)
          PY

      - name: Render Shorts and Long Video
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          out = Path("output")
          images = sorted((out / "images").glob("*.jpg"))

          if not images:
              raise SystemExit("No images found.")

          def run(args):
              subprocess.run(args, check=True)

          def duration(path):
              value = subprocess.check_output([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ], text=True).strip()
              return float(value)

          def render(label, voice_name, srt_name, width, height, filename):
              voice = out / voice_name
              srt = out / srt_name

              if not voice.exists() or not srt.exists():
                  raise SystemExit("Voice/subtitles missing: " + label)

              clips = []

              for i, image in enumerate(images):
                  clip = out / f"{label}_{i:02}.mp4"

                  vf = (
                      f"scale={width}:{height}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width}:{height},"
                      "zoompan=z='min(zoom+0.001,1.12)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d=125:s={width}x{height}:fps=25,"
                      "format=yuv420p"
                  )

                  run([
                      "ffmpeg", "-y", "-loglevel", "error",
                      "-loop", "1", "-f", "image2", "-i", str(image),
                      "-vf", vf, "-t", "5",
                      "-an", "-c:v", "libx264",
                      "-preset", "ultrafast",
                      "-pix_fmt", "yuv420p", str(clip)
                  ])
                  clips.append(clip)

              concat = out / f"{label}_concat.txt"
              concat.write_text(
                  "".join(
                      f"file '{p.resolve()}'\n" for p in clips
                  ),
                  encoding="utf-8"
              )

              slideshow = out / f"{label}_slideshow.mp4"
              run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-f", "concat", "-safe", "0", "-i", str(concat),
                  "-c", "copy", str(slideshow)
              ])

              subtitle_filter = (
                  f"subtitles={srt.as_posix()}:"
                  "force_style='FontName=Noto Sans Devanagari,FontSize=24,"
                  "PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,"
                  "BorderStyle=1,Outline=2,Alignment=2,MarginV=50'"
              )

              final = out / filename

              run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-stream_loop", "-1", "-i", str(slideshow),
                  "-i", str(voice),
                  "-vf", subtitle_filter,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-t", str(duration(voice)),
                  "-c:v", "libx264", "-preset", "ultrafast",
                  "-crf", "25", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "128k",
                  "-movflags", "+faststart", str(final)
              ])

              if not final.exists() or final.stat().st_size == 0:
                  raise SystemExit("Video creation failed: " + filename)

              print("Created:", filename)

          render(
              "short", "short_voice.mp3", "short.srt",
              720, 1280, "youtube_short.mp4"
          )

          render(
              "long", "long_voice.mp3", "long.srt",
              1280, 720, "youtube_long.mp4"
          )

          print("Both videos rendered successfully.")
          PY

      - name: Save Video Package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-package-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Videos to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          for name in [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN"
          ]:
              if not os.environ.get(name, "").strip():
                  raise SystemExit("Missing GitHub Secret: " + name)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"].strip(),
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          try:
              credentials.refresh(Request())
          except Exception as e:
              raise SystemExit(
                  "YouTube authorization failed. Refresh token may have expired. "
                  + str(e)
              )

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          content = json.loads(
              Path("output/content.json").read_text(encoding="utf-8")
          )

          description = (
              content.get("description", "") + "\n\n" +
              " ".join(content.get("hashtags", []))
          ).strip()

          videos = [
              (
                  "output/youtube_short.mp4",
                  (content["title"] + " #Shorts")[:100],
                  description + "\n#Shorts"
              ),
              (
                  "output/youtube_long.mp4",
                  content["long_title"][:100],
                  description
              )
          ]

          for filename, title, desc in videos:
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit("Video missing: " + filename)

              body = {
                  "snippet": {
                      "title": title,
                      "description": desc[:5000],
                      "categoryId": "28",
                      "defaultLanguage": "hi"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  mimetype="video/mp4",
                  resumable=True
              )

              response = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              ).execute()

              print(
                  "Upload successful. Video ID:",
                  response["id"]
              )

          print("Both videos uploaded as public.")
          PY

      - name: Upload to Facebook Page (Resumable API)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          from pathlib import Path

          video_path = Path("output/youtube_long.mp4")
          if not video_path.is_file():
              raise SystemExit("Video file not found for Facebook upload.")

          page_id = os.environ["FB_PAGE_ID"]
          token = os.environ["FB_PAGE_ACCESS_TOKEN"]
          file_size = video_path.stat().st_size

          print(f"Starting Facebook upload for {file_size/1024/1024:.2f} MB...")

          start_url = f"https://graph-video.facebook.com/v21.0/{page_id}/videos"
          start_payload = {"upload_phase": "start", "file_size": file_size, "access_token": token}
          
          r = requests.post(start_url, data=start_payload)
          if r.status_code != 200:
              raise SystemExit(f"Start phase failed: {r.text}")
              
          data = r.json()
          upload_session_id = data["upload_session_id"]
          start_offset = int(data["start_offset"])
          end_offset = int(data["end_offset"])

          with open(video_path, "rb") as f:
              while start_offset < end_offset:
                  f.seek(start_offset)
                  chunk = f.read(end_offset - start_offset)
                  files = {"video_file_chunk": ("chunk.mp4", chunk, "video/mp4")}
                  transfer_payload = {
                      "upload_phase": "transfer", 
                      "upload_session_id": upload_session_id, 
                      "start_offset": start_offset, 
                      "access_token": token
                  }
                  r = requests.post(start_url, data=transfer_payload, files=files)
                  if r.status_code != 200:
                      raise SystemExit(f"Transfer phase failed: {r.text}")
                      
                  res = r.json()
                  start_offset = int(res["start_offset"])
                  end_offset = int(res["end_offset"])
                  print(f"Uploaded chunk: {start_offset}/{file_size} bytes")

          finish_payload = {
              "upload_phase": "finish", 
              "upload_session_id": upload_session_id, 
              "access_token": token, 
              "description": "New Video from my Auto Channel! #AutoTech #Science"
          }
          r = requests.post(start_url, data=finish_payload)
          if r.status_code != 200:
              raise SystemExit(f"Finish phase failed: {r.text}")
              
          print("Facebook upload successful!")
          PY
