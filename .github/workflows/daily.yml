
name: Daily YouTube Video Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts requests google-api-python-client google-auth

      - name: Generate Hindi Scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from pathlib import Path

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY secret missing")

          base = "https://generativelanguage.googleapis.com/v1beta"
          req = urllib.request.Request(
              base + "/models",
              headers={"x-goog-api-key": key}
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              models = json.loads(r.read().decode()).get("models", [])

          candidates = [
              m["name"] for m in models
              if "generateContent" in m.get("supportedGenerationMethods", [])
              and "flash" in m["name"].lower()
          ]
          if not candidates:
              raise SystemExit("No Gemini Flash model available")

          model = candidates[0]
          print("Gemini model:", model)

          prompt = """
          Create an interesting Hindi YouTube science or real-world mystery topic.
          Use accurate facts. Write natural Hindi in Devanagari.
          Return only valid JSON:
          {
            "topic": "topic",
            "title": "Hindi Shorts title",
            "short_script": "45-60 second narration",
            "long_title": "Hindi long video title",
            "long_script": "4-5 minute narration",
            "description": "Hindi description",
            "hashtags": ["#Science", "#Hindi", "#Mystery"]
          }
          """

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.7,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              base + "/" + model + ":generateContent",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=120) as r:
              result = json.loads(r.read().decode())

          parts = result.get("candidates", [{}])[0].get(
              "content", {}
          ).get("parts", [])
          raw = "".join(p.get("text", "") for p in parts).strip()
          data = json.loads(raw)

          for field in [
              "topic", "title", "short_script",
              "long_title", "long_script", "description"
          ]:
              if not str(data.get(field, "")).strip():
                  raise SystemExit("Missing field: " + field)

          out = Path("output")
          out.mkdir(exist_ok=True)
          (out / "content.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          (out / "short_script.txt").write_text(
              data["short_script"], encoding="utf-8"
          )
          (out / "long_script.txt").write_text(
              data["long_script"], encoding="utf-8"
          )
          print("Hindi scripts generated.")
          PY

      - name: Generate Hindi Voice and Subtitles
        run: |
          edge-tts --voice hi-IN-SwaraNeural \
            --file output/short_script.txt \
            --write-media output/short_voice.mp3 \
            --write-subtitles output/short.srt

          edge-tts --voice hi-IN-SwaraNeural \
            --file output/long_script.txt \
            --write-media output/long_voice.mp3 \
            --write-subtitles output/long.srt

      - name: Download Science Images
        run: |
          python - <<'PY'
          import requests, time
          from pathlib import Path

          folder = Path("output/images")
          folder.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers["User-Agent"] = "HindiScienceVideo/1.0"

          topics = [
              "space nebula", "Mars planet", "black hole astronomy",
              "deep sea ocean", "robot technology", "galaxy stars",
              "scientific laboratory", "telescope astronomy"
          ]
          saved = 0

          for topic in topics:
              if saved >= 8:
                  break
              try:
                  r = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": topic + " filetype:bitmap",
                          "gsrnamespace": 6,
                          "gsrlimit": 8,
                          "prop": "imageinfo",
                          "iiprop": "url",
                          "iiurlwidth": 1280,
                          "format": "json"
                      },
                      timeout=30
                  )
                  r.raise_for_status()
                  pages = r.json().get("query", {}).get("pages", {})
                  for page in pages.values():
                      if saved >= 8:
                          break
                      info = page.get("imageinfo", [{}])[0]
                      url = info.get("thumburl") or info.get("url")
                      if not url:
                          continue
                      try:
                          img = session.get(url, timeout=30)
                          img.raise_for_status()
                          if not img.headers.get(
                              "Content-Type", ""
                          ).startswith("image/"):
                              continue
                          if len(img.content) < 10000:
                              continue
                          saved += 1
                          (folder / f"image_{saved:02}.jpg").write_bytes(
                              img.content
                          )
                          print("Downloaded image", saved)
                      except Exception as e:
                          print("Image skipped:", str(e)[:100])
                  time.sleep(0.5)
              except Exception as e:
                  print("Search skipped:", str(e)[:100])

          if saved == 0:
              raise SystemExit("No images downloaded")
          print("Total images:", saved)
          PY

      - name: Render Shorts and Long Video
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          out = Path("output")
          images = sorted((out / "images").glob("*.jpg"))
          if not images:
              raise SystemExit("No images found")

          def run(args):
              subprocess.run(args, check=True)

          def duration(path):
              return float(subprocess.check_output([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ], text=True).strip())

          def render(label, voice_name, srt_name, w, h, filename):
              voice = out / voice_name
              srt = out / srt_name
              clips = []

              for i, img in enumerate(images):
                  clip = out / f"{label}_{i:02}.mp4"
                  vf = (
                      f"scale={w}:{h}:force_original_aspect_ratio=increase,"
                      f"crop={w}:{h},"
                      "zoompan=z='min(zoom+0.001,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=125:s={w}x{h}:fps=25,format=yuv420p"
                  )
                  run([
                      "ffmpeg", "-y", "-loglevel", "error",
                      "-loop", "1", "-i", str(img),
                      "-vf", vf, "-t", "5", "-an",
                      "-c:v", "libx264", "-preset", "ultrafast",
                      "-pix_fmt", "yuv420p", str(clip)
                  ])
                  clips.append(clip)

              concat = out / f"{label}_concat.txt"
              concat.write_text(
                  "".join(f"file '{p.resolve()}'\n" for p in clips),
                  encoding="utf-8"
              )

              slideshow = out / f"{label}_slideshow.mp4"
              run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-f", "concat", "-safe", "0", "-i", str(concat),
                  "-c", "copy", str(slideshow)
              ])

              subtitle_filter = (
                  f"subtitles={srt.as_posix()}:"
                  "force_style='FontName=DejaVu Sans,FontSize=24,"
                  "PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,"
                  "BorderStyle=1,Outline=2,Alignment=2,MarginV=50'"
              )

              final = out / filename
              run([
                  "ffmpeg", "-y", "-loglevel", "error",
                  "-stream_loop", "-1", "-i", str(slideshow),
                  "-i", str(voice),
                  "-vf", subtitle_filter,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-t", str(duration(voice)),
                  "-c:v", "libx264", "-preset", "ultrafast",
                  "-crf", "25", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "128k",
                  "-movflags", "+faststart", str(final)
              ])
              print("Created:", final)

          render(
              "short", "short_voice.mp3", "short.srt",
              720, 1280, "youtube_short.mp4"
          )
          render(
              "long", "long_voice.mp3", "long.srt",
              1280, 720, "youtube_long.mp4"
          )
          print("Videos rendered.")
          PY

      - name: Save Video Package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-package-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Videos to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          for name in [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN"
          ]:
              if not os.environ.get(name, "").strip():
                  raise SystemExit("Missing GitHub Secret: " + name)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"].strip(),
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )
          credentials.refresh(Request())

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          content = json.loads(
              Path("output/content.json").read_text(encoding="utf-8")
          )
          description = (
              content.get("description", "") + "\n\n" +
              " ".join(content.get("hashtags", []))
          ).strip()

          videos = [
              (
                  "output/youtube_short.mp4",
                  (content["title"] + " #Shorts")[:100],
                  description + "\n#Shorts"
              ),
              (
                  "output/youtube_long.mp4",
                  content["long_title"][:100],
                  description
              )
          ]

          for filename, title, desc in videos:
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit("Video missing: " + filename)

              body = {
                  "snippet": {
                      "title": title,
                      "description": desc[:5000],
                      "categoryId": "28",
                      "defaultLanguage": "hi"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              }

              media = MediaFileUpload(
                  str(path),
                  mimetype="video/mp4",
                  resumable=True
              )

              response = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              ).execute()

              print("Uploaded video ID:", response["id"])

          print("Both videos uploaded privately.")
          PY
